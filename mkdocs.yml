# MUSA AITER documentation — build locally: pip install -e ".[docs]" && mkdocs serve
site_name: MUSA AITER
site_description: AI Tensor Engine for MUSA — reference APIs, operators, and operations guides.

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo

markdown_extensions:
  - tables
  - fenced_code
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - API and policy:
      - API policy: API_POLICY.md
      - Package and install: deploy/package-install.md
      - Examples (scripts): examples_index.md
      - vLLM 0.20 integration: VLLM_0_20_INTEGRATION_GUIDE.md
      - SGLang integration: SGLANG_INTEGRATION_GUIDE.md
      - Docker: DOCKER.md
      - Docker + TorchMUSA (template): DOCKER_TORCHMUSA.md
      - Security artifacts: SECURITY_ARTIFACTS.md
  - Benchmarks:
      - Overview: benchmarks/index.md
